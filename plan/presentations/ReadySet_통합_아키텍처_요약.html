<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadySet 아키텍처 요약</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;600&display=swap">
<style>
/* Layout: 간소화 버전. 이름 위주, 설명 최소. 좌 의미 축 · 중앙 4계층 · 우 SpinX 축. 모노톤 + 단일 액센트. */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#14213d; --ink-2:#3a4a66; --muted:#6b7685; --hair:#d9dee6; --panel:#f5f7fa;
  --accent:#4b3fc4; --accent-soft:#f6f5fd;
  --font:'Noto Sans KR','Inter',system-ui,sans-serif;
  --num:'Inter','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:44px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
p{margin:0}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-0.02em}
.lede{font-size:14.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:8px}
.scroller{overflow-x:auto;border-top:1px solid var(--ink);padding-top:12px}
svg.dia{display:block;width:100%;min-width:980px;height:auto}
.dia text{font-family:var(--font);fill:var(--ink)}
.dia .mu{fill:var(--muted)}
.dia .sb{font-weight:600}
.dia .num{font-family:var(--num)}
.dia .cap{font-size:10px;letter-spacing:.12em;font-weight:600;fill:var(--muted);font-family:var(--num)}
</style>

  <span><i style="background:var(--ink)"></i>기 구축</span>

    <rect x="748" y="482" width="142" height="56" rx="3" fill="#fff" stroke="#e1e5eb"/>

</div>

</html>
